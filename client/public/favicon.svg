<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gympilot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gympilot-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gympilot-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#gympilot-bg)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Subtle Radial Glow Behind Logo -->
  <circle cx="256" cy="256" r="160" fill="url(#gympilot-glow)" />

  <!-- Dumbbell Weights Left -->
  <rect x="88" y="160" width="36" height="192" rx="16" fill="url(#gympilot-accent)" />
  <rect x="136" y="196" width="28" height="120" rx="12" fill="#34D399" />

  <!-- Dumbbell Weights Right -->
  <rect x="388" y="160" width="36" height="192" rx="16" fill="url(#gympilot-accent)" />
  <rect x="348" y="196" width="28" height="120" rx="12" fill="#34D399" />

  <!-- Center Shaft / Handle -->
  <rect x="164" y="240" width="184" height="32" rx="8" fill="#F8FAFC" />

  <!-- Center Navigator / Pilot Wings Compass Accent -->
  <path d="M256 128 L288 232 L256 216 L224 232 Z" fill="#34D399" />
  <path d="M256 384 L224 280 L256 296 L288 280 Z" fill="#059669" />

  <!-- Pilot Diamond Center -->
  <circle cx="256" cy="256" r="16" fill="#10B981" stroke="#0F172A" stroke-width="4" />
</svg>

